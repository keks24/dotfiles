# "file_type"
file_type:
  image:
    foreground: "purple"
  video:
    foreground: "purple"
    is_bold: true
  music:
    foreground: "cyan"
  lossless:
    foreground: "cyan"
    is_bold: false
    is_underline: true
  crypto:
    foreground: "white"
    is_bold: false
    is_reverse: true
  document:
    foreground: "white"
    is_underline: true
  compressed:
    foreground: "red"
  temp:
    foreground: "white"
    is_dimmed: true
  compiled:
    foreground: "green"
    is_bold: true
    is_underline: true
  build:
    foreground: "yellow"
    is_bold: false
    is_underline: true
  source:
    foreground: "yellow"
    is_bold: false

# miscellaneous
punctuation:
  foreground: "darkgray"
  is_bold: false

date:
  foreground: "blue"

inode:
  foreground: "purple"

## this has no effect
blocks:
  foreground: "cyan"

header:
  foreground: "white"
  is_underline: true

octal:
  foreground: "lightpurple"

# mac, bsd and windows only
flags:
  foreground: "white"

control_char:
  foreground: "red"
  is_bold: true
  is_underline: true

## symlink filename
### only has an effect in "grid view", if the environment variable "LS_COLORS" and "EZA_COLORS" are unset.
### "grid view" is correct, "list view" ("--long") is faulty: arrow gets coloured
broken_symlink:
  foreground: "white"
  background: "red"
  is_bold: true

## symlink target path
broken_path_overlay:
  foreground: "white"
  background: "red"
  is_underline: false
  is_bold: true

