# list of theme options as "yaml dictionaries":
## from: "man --pager="less '+/LIST OF THEME OPTIONS'" 5 eza_colors-explanation"
## see also:
### https://deepwiki.com/eza-community/eza-themes/3.4-theme-categories
### https://github.com/eza-community/eza-themes/blob/main/themes/default.yml
### "eza-community/eza-themes/themes/default.yml"
### "eza-community/eza/src/theme/lsc.rs"
### "eza-community/eza/src/theme/default_theme.rs"
### "eza-community/eza/src/theme/ui_styles.rs"
#
# filekinds:     perms:             size:             users:        links:
#   normal        user_read           major             user_you      normal
#   directory     user_write          minor             user_root     multi_link_file
#   symlink       user_execute_file   number_byte       user_other
#   pipe          user_execute_other  number_kilo       group_yours
#   block_device  group_read          number_mega       group_other
#   char_device   group_write         number_giga       group_root
#   socket        group_execute       number_huge
#   special       other_read          unit_byte
#   executable    other_write         unit_kilo
#   mount_point   other_execute       unit_mega
#                 special_user_file   unit_giga
#                 special_other       unit_huge
#                 attribute
#
# git:           git_repo:          security_context: file_type:    punctuation:
#   new            branch_main        none:             image       date:
#   modified       branch_other       selinux:          video       inode:
#   deleted        git_clean            colon           music       blocks:
#   renamed        git_dirty            user            crypto      header:
#   ignored                             role            document    octal:
#   conflicted                          typ             compressed  flags:
#                                       range           temp        control_char:
#                                                       compiled    broken_symlink:
#                                                       build       broken_path_overlay:
#                                                       source      colourful:
#                                                                   filenames:
#                                                                     <some_filename>:
#                                                                       filename:
#                                                                   extensions:
#                                                                     <some_filename_extension>:
#                                                                       filename:
#
# each of those fields/sub fields can have the following styling properties defined beneath it:
#
# foreground: Blue
# background: null
# is_bold: false
# is_dimmed: false
# is_italic: false
# is_underline: false
# is_blink: false
# is_reverse: false
# is_hidden: false
# is_strikethrough: true
# prefix_with_reset: false
#
# example:
#
# file_type:
#   image:
#     foreground: Blue
#     is_italic: true
# date:
#   foreground: White
#
# security_context:
#   selinux:
#     role:
#       is_hidden: true
#
# icons can now be customized as well in the filenames and extensions fields
#
# filenames:
#   # Just change the icon glyph
#   Cargo.toml: {icon: {glyph: 🦀}}
#   Cargo.lock: {icon: {glyph: 🦀}}
#
# extensions:
#   rs: {  filename: {foreground: Red}, icon: {glyph: 🦀}}
#
# notes:
#
# not all glyphs support changing colors.
#
# if your theme is not working properly, double check the syntax in the config file, as a syntax issue can cause
# multiple properties to not be applied.
#
# you must name the file theme.yml, no matter the directory you specify.

# TODO:
# * pick colour hexcodes and enter them here like so: "#xxxxxx".
# * configure "EZA_COLORS".

# "filekinds"
filekinds:
  normal:
    foreground: "white"
  directory:
    foreground: "blue"
    is_bold: true
  symlink:
    foreground: "cyan"
    is_bold: true
  pipe:
    foreground: "yellow"
    is_bold: true
    is_underline: true
  block_device:
    foreground: "yellow"
    is_bold: true
  char_device:
    foreground: "purple"
    is_bold: true
  socket:
    foreground: "red"
    is_bold: true
  mount_point:
    foreground: "blue"
    is_bold: true
    is_underline: true

