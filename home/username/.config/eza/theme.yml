# "size"
size:
  # block or character device files: device driver id
  major:
    foreground: "cyan"
    is_bold: true
  # block or character device files: device id
  minor:
    foreground: "yellow"
  number_byte:
    foreground: "darkgray"
  number_kilo:
    foreground: "green"
    is_bold: false
  number_mega:
    foreground: "yellow"
    is_bold: true
  number_giga:
    foreground: "red"
    is_bold: true
  number_huge:
    foreground: "purple"
    is_bold: true
  # these are not working
  #unit_byte:
  #unit_kilo:
  #unit_mega:
  #unit_giga:
  #unit_huge:

# "users"
users:
  user_you:
    foreground: "blue"
    is_bold: false
  user_root:
    foreground: "red"
    is_bold: true
  user_other:
    foreground: "yellow"
  group_yours:
    foreground: "blue"
    is_bold: false
  group_other:
    foreground: "yellow"
  group_root:
    foreground: "red"
    is_bold: true

# "links"
## only visible via parameter "--links" for now:
### https://github.com/eza-community/eza/issues/765
links:
  normal:
    foreground: "red"
    is_bold: true
  multi_link_file:
    foreground: "red"
    background: "yellow"

# "git"
## there are still some bugs:
### for option "ignored": https://github.com/eza-community/eza/issues/521
##
## indicator legend:
### | options      | tracked/staged | untracked/unstaged |
### | :----------- | :------------- | :----------------- |
### | not modified | -              | -                  |
### | new          | N              | N                  |
### | modified     | M              | M                  |
### | deleted      | D              |                    |
### | renamed      | N              |                    |
### | typechange   | T              |                    |
### | ignored      |                | I                  |
### | conflicted   |                | U                  |
git:
  new:
    foreground: "green"
  modified:
    foreground: "yellow"
  deleted:
    foreground: "red"
  renamed:
    foreground: "blue"
  typechange:
    foreground: "purple"
    is_bold: true
  ignored:
    foreground: "white"
    is_dimmed: true
  conflicted:
    foreground: "red"
    is_bold: true

# "git_repo"
## indicator legend:
### | options      | branch states      | indicators          |
### | :----------- | :----------------- | :------------------ |
### | branch_main  | none               | <branch_name>       |
### | branch_other | none               | <other_branch_name> |
### | git_clean    | clean              | |                   |
### | git_dirty    | new, modified, ... | +                   |
git_repo:
  branch_main:
    foreground: "green"
  branch_other:
    foreground: "yellow"
  git_clean:
    foreground: "green"
  git_dirty:
    foreground: "yellow"

